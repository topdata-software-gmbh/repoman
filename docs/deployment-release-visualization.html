const L=[
{from:"prepare",to:"build",d:"M200 76V102"},
{from:"build",to:"package",d:"M200 160V186"},
{from:"package",to:"read",d:"M200 244V270"},
{from:"read",to:"merge",d:"M200 328V354"},
{from:"merge",to:"upload-artifact",d:"M200 412V438"},
{from:"upload-artifact",to:"upload-manifest",d:"M200 496V522"},
{from:"upload-manifest",to:"upload-catalog",d:"M200 580V606"},
{from:"upload-catalog",to:"client",d:"M200 664V690"},
{from:"merge",to:"dryrun",d:"M330 384H398",dash:1,opt:"dryrun"},
{from:"dryrun",to:"upload-artifact",d:"M525 412V468H332",dash:1,opt:"dryrun"},
{from:"upload-catalog",to:"verify",d:"M330 636H398",dash:1,opt:"verify"},
{from:"verify",to:"client",d:"M525 664V720H332",dash:1,opt:"verify"}];
const TITLES={
en:{prepare:"Bump version",build:"Build binary",package:"Package artifact",read:"Read store",merge:"Merge metadata",dryrun:"Preview (dry run)","upload-artifact":"Upload artifact","upload-manifest":"Upload manifest","upload-catalog":"Upload catalog",verify:"Verify read",client:"Client update"},
de:{prepare:"Version erhöhen",build:"Binary bauen",package:"Artefakt packen",read:"Store lesen",merge:"Metadaten mergen",dryrun:"Vorschau (Dry Run)","upload-artifact":"Artefakt hochladen","upload-manifest":"Manifest hochladen","upload-catalog":"Katalog hochladen",verify:"Read verifizieren",client:"Client-Update"}};
const byId=Object.fromEntries(N.map(n=>[n.id,n]));
const on={dryrun:true,verify:true};
const $=id=>document.getElementById(id);
const root=document.documentElement,tm=matchMedia("(prefers-color-scheme:dark)");
let stored=null;try{stored=localStorage.getItem("td-doc-theme")}catch(_){}
let lang=null;try{lang=localStorage.getItem("td-doc-lang")}catch(_){}
if(lang!=="de"&&lang!=="en")lang=(navigator.language||"en").toLowerCase().startsWith("de")?"de":"en";
const U=()=>UI[lang],C=id=>TXT[lang][id],T=id=>TITLES[lang][id];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let mode="idle",paused=false,run=0,open=null,walked=[],d3ui=null;
const syncTheme=()=>{const d=root.dataset.theme==="dark";$("theme").textContent=d?"☀":"☾";const l=d?U().light:U().dark;$("theme").setAttribute("aria-label",l);$("theme").title=l};
if(!stored&&tm.addEventListener)tm.addEventListener("change",e=>{root.dataset.theme=e.matches?"dark":"light";syncTheme()});
$("theme").onclick=()=>{const t=root.dataset.theme==="dark"?"light":"dark";root.dataset.theme=t;try{localStorage.setItem("td-doc-theme",t)}catch(_){}syncTheme()};
const renderChips=()=>{$("files").innerHTML="";walked.forEach(id=>{const el=document.createElement("span");el.className="chip";el.textContent=C(id).out;$("files").appendChild(el)})};
function setMode(m){mode=m;const w=$("walk"),p=$("pause"),s=$("stop"),r=m==="run"||m==="pause";
 w.disabled=r;p.hidden=s.hidden=!r;p.textContent=m==="pause"?"▶":"⏸";
 const pl=m==="pause"?U().resume:U().pause;p.setAttribute("aria-label",pl);p.title=pl;
 s.setAttribute("aria-label",U().stopBtn);s.title=U().stopBtn;
 w.textContent=m==="done"?U().replay:U().walk}
if(!window.d3){}
else{
const svg=d3.select("#svg");
svg.append("defs").append("marker").attr("id","arr").attr("viewBox","0 0 10 10").attr("refX",8).attr("refY",5).attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto-start-reverse")
 .append("path").attr("d","M2 1L8 5L2 9").attr("fill","none").attr("stroke","var(--td-color-fg-muted)").attr("stroke-width",1.5).attr("stroke-linecap","round").attr("stroke-linejoin","round");
const links=svg.append("g").selectAll("path").data(L).join("path").attr("class",d=>"link"+(d.dash?" dash":"")).attr("d",d=>d.d).attr("marker-end","url(#arr)");
const nodes=svg.append("g").selectAll("g").data(N).join("g")
 .attr("class",d=>"node "+(d.opt?"opt":"core")).attr("transform",d=>`translate(${d.x},${d.y})`)
 .attr("tabindex",0).attr("role","button").attr("aria-label",d=>`${T(d.id)}: ${C(d.id).s}`);
nodes.append("rect").attr("width",d=>d.w).attr("height",d=>d.h).attr("rx",8);
nodes.append("text").attr("class","th").attr("x",d=>d.w/2).attr("y",20).text(d=>T(d.id));
nodes.append("text").attr("class","ts").attr("x",d=>d.w/2).attr("y",39).text(d=>C(d.id).s);
const leg=svg.append("g").attr("transform","translate(70,772)");
leg.append("rect").attr("width",16).attr("height",16).attr("rx",4).style("fill","var(--node-core-bg)").style("stroke","var(--td-color-primary)").style("stroke-width",1);
const legCore=leg.append("text").attr("class","leg").attr("x",24).attr("y",9).text(U().core);
leg.append("rect").attr("x",130).attr("width",16).attr("height",16).attr("rx",4).style("fill","var(--node-opt-bg)").style("stroke","var(--td-color-accent)").style("stroke-dasharray","3 2");
const legOpt=leg.append("text").attr("class","leg").attr("x",154).attr("y",9).text(U().opt);
const token=svg.append("circle").attr("r",7).attr("fill","var(--td-color-warning)").attr("opacity",0).attr("pointer-events","none");
const fit=()=>nodes.each(function(d){[["th",15],["ts",12.5]].forEach(([cls,base])=>{const t=this.querySelector("."+cls);t.style.fontSize="";let fs=base;while(t.getComputedTextLength()>d.w-14&&fs>9){fs-=.5;t.style.fontSize=fs+"px"}})});
fit();
d3ui={nodes,legCore,legOpt,fit};
const vis=()=>N.filter(n=>!n.opt||on[n.id]);
const showCap=n=>{const c=C(n.id);$("cap").innerHTML="<b></b><span></span>";$("cap").firstChild.textContent=T(n.id)+" — "+c.s;$("cap").lastChild.textContent=c.what};
nodes.on("mouseenter focus",(e,d)=>{links.classed("dim",l=>l.from!==d.id&&l.to!==d.id)}).on("mouseleave blur",()=>links.classed("dim",false))
 .on("click",(e,d)=>openModal(d.id)).on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openModal(d.id)}});
function applyOpt(){
 nodes.filter(d=>d.opt).transition().duration(250).style("opacity",d=>on[d.id]?1:.18).style("pointer-events",d=>on[d.id]?"auto":"none").attr("tabindex",d=>on[d.id]?0:-1);
 links.filter(d=>d.opt).transition().duration(250).style("opacity",d=>on[d.opt]?1:0);
}
["dryrun","verify"].forEach(k=>$("t-"+k).onchange=e=>{on[k]=e.target.checked;resetWalk();applyOpt()});
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const easeCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function resetWalk(){run++;paused=false;nodes.classed("active",false);token.attr("opacity",0);setMode("idle")}
function moveToken(el,me){
 return new Promise(res=>{
  const len=el.getTotalLength(),dur=reduce?1:750;let prog=0,last=null;
  const tick=now=>{
   if(me!==run)return res();
   if(last===null)last=now;
   const dt=now-last;last=now;
   if(!paused){prog=Math.min(1,prog+dt/dur);const p=el.getPointAtLength(easeCubic(prog)*len);token.attr("transform",`translate(${p.x},${p.y})`)}
   if(prog<1)requestAnimationFrame(tick);else res();
  };
  requestAnimationFrame(tick);
 });
}
async function walk(){
 resetWalk();const me=run;setMode("run");walked=[];renderChips();
 const route=vis().sort((a,b)=>route0(a)-route0(b));
 for(let i=0;i<route.length;i++){
  const n=route[i];
  if(i>0){
   const lk=L.find(l=>l.from===route[i-1].id&&l.to===n.id),el=links.filter(d=>d===lk).node();
   token.attr("opacity",1);
   await moveToken(el,me);
   if(me!==run)return;
  }
  nodes.classed("active",d=>d===n);showCap(n);walked.push(n.id);renderChips();
  await sleep(reduce?600:1100);
  while(paused){if(me!==run)return;await sleep(90)}
  if(me!==run)return;
 }
 token.attr("opacity",0);nodes.classed("active",false);setMode("done");
}
const ORDER=["prepare","build","package","read","merge","dryrun","upload-artifact","upload-manifest","upload-catalog","verify","client"];
function route0(n){return ORDER.indexOf(n.id)}
$("walk").onclick=()=>{if(mode==="run"||mode==="pause")return;walk()};
$("pause").onclick=()=>{if(mode==="run"){paused=true;setMode("pause")}else if(mode==="pause"){paused=false;setMode("run")}};
$("stop").onclick=resetWalk;
}
const visIds=()=>N.filter(n=>!n.opt||on[n.id]).map(n=>n.id);
function openModal(id){
 const list=visIds(),n=byId[id],c=C(id),i=list.indexOf(id);open=id;
 $("m-title").textContent=c.s;$("m-cmd").textContent=T(id);
 $("m-body").innerHTML=`<p>${esc(c.what)}</p><h3>${U().inc}</h3><ul>${c.list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><h3>${U().outH}</h3><p><code>${esc(c.out)}</code></p><div class="tip">${esc(c.tip)}</div><h3>${U().exH}</h3><pre>${esc(c.ex)}</pre>`;
 $("m-prev").disabled=i<=0;$("m-next").disabled=i>=list.length-1;$("m-prev").dataset.t=list[i-1]||"";$("m-next").dataset.t=list[i+1]||"";
 $("m-copy").textContent=U().copy;$("back").classList.add("open");$("m-close").focus();
}
function closeModal(){$("back").classList.remove("open");const el=[...document.querySelectorAll(".node")].find(g=>g.__data__&&g.__data__.id===open);if(el)el.focus()}
$("m-close").onclick=closeModal;
$("back").addEventListener("click",e=>{if(e.target===$("back"))closeModal()});
$("m-prev").onclick=e=>openModal(e.currentTarget.dataset.t);
$("m-next").onclick=e=>openModal(e.currentTarget.dataset.t);
$("m-copy").onclick=async()=>{try{await navigator.clipboard.writeText(C(open).ex);$("m-copy").textContent=U().copied}catch(_){$("m-copy").textContent=U().copyFail}};
document.addEventListener("keydown",e=>{
 if(!$("back").classList.contains("open"))return;
 if(e.key==="Escape")closeModal();
 if(e.key==="ArrowRight"&&!$("m-next").disabled)openModal($("m-next").dataset.t);
 if(e.key==="ArrowLeft"&&!$("m-prev").disabled)openModal($("m-prev").dataset.t);
 if(e.key==="Tab"){const f=[...$("modal").querySelectorAll("button:not(:disabled)")],a=document.activeElement;
  if(e.shiftKey&&a===f[0]){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&a===f[f.length-1]){e.preventDefault();f[0].focus()}}
});
function applyLang(){
 document.documentElement.lang=lang;document.title=U().title;
 $("h1").textContent=U().title;$("sub").textContent=U().sub;
 $("l-dryrun").textContent=U().incDryrun;$("l-verify").textContent=U().incVerify;
 $("m-prev").textContent=U().prev;$("m-next").textContent=U().next;$("m-close").textContent=U().close;
 $("seg").setAttribute("aria-label",U().lang);$("svg").setAttribute("aria-label",U().svg);
 $("lang-en").setAttribute("aria-pressed",String(lang==="en"));$("lang-de").setAttribute("aria-pressed",String(lang==="de"));
 syncTheme();
 if(!window.d3)$("cap").textContent=U().d3err;
 else{d3ui.nodes.select(".th").text(d=>T(d.id));d3ui.nodes.select(".ts").text(d=>C(d.id).s);d3ui.nodes.attr("aria-label",d=>`${T(d.id)}: ${C(d.id).s}`);d3ui.fit();
  d3ui.legCore.text(U().core);d3ui.legOpt.text(U().opt);renderChips();
  if(open)openModal(open);
  else if(mode==="idle"&&!walked.length)$("cap").innerHTML=`<span>${U().capEmpty}</span>`}
 setMode(mode);
}
["en","de"].forEach(k=>$("lang-"+k).onclick=()=>{lang=k;try{localStorage.setItem("td-doc-lang",k)}catch(_){}applyLang()});
applyLang();
</script>
