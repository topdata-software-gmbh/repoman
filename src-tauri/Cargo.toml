[package]
name = "repoman"
version = "0.1.0"
description = "Multi-Git GUI Manager"
edition = "2021"
rust-version = "1.80.0"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tokio = { version = "1.38", features = ["full"] }
ignore = "0.4"
notify = "6.1"
uuid = { version = "1.9", features = ["v4", "v5", "serde"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
url = "2"
# AI commit-message generation seam (specs/002) — ONLY src-tauri/src/commitgen/ may use it.
# Pinned to a tag; default-features off because the workspace's proc-macro crate is broken at 0.2.6.
serdes-ai = { git = "https://github.com/janfeddersen-wq/serdesAI", tag = "v0.2.6", default-features = false, features = ["openai"] }
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
