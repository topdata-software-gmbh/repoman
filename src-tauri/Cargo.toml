[package]
name = "repoman"
version = "0.1.0"
description = "Multi-Git GUI Manager"
edition = "2021"
rust-version = "1.78.0"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tokio = { version = "1.38", features = ["full"] }
ignore = "0.4"
notify = "6.1"
uuid = { version = "1.9", features = ["v4", "v5", "serde"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
url = "2"

[dev-dependencies]
tempfile = "3"
